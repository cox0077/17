<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 Messenger</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #111;
}

button,
input {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* AUTH */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.authBox {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 15px 50px rgba(0,0,0,.08);
}

.logo {
    text-align: center;
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.authBox input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-bottom: 12px;
    outline: none;
}

.authBox input:focus {
    border-color: #111;
}

.authButton {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    background: #111;
    color: white;
    cursor: pointer;
    margin-top: 5px;
}

.authButton:hover {
    opacity: .9;
}

.switchAuth {
    text-align: center;
    margin-top: 20px;
    color: #666;
    cursor: pointer;
}

.switchAuth:hover {
    color: #111;
}

.authError {
    color: #d00;
    min-height: 20px;
    text-align: center;
    margin-top: 10px;
}

/* APP */

#app {
    height: 100vh;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: 320px;
    background: white;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
}

.sidebarHeader {
    padding: 20px;
    border-bottom: 1px solid #eee;
}

.brand {
    font-size: 30px;
    font-weight: 800;
}

.myAccount {
    margin-top: 8px;
    color: #777;
    font-size: 14px;
}

.usersTitle {
    padding: 18px 20px 10px;
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
}

#usersList {
    overflow-y: auto;
    flex: 1;
}

.user {
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-bottom: 1px solid #f2f2f2;
}

.user:hover {
    background: #f5f5f5;
}

.user.active {
    background: #eee;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
}

.userInfo {
    flex: 1;
}

.userName {
    font-weight: 600;
}

.status {
    font-size: 12px;
    color: #999;
    margin-top: 3px;
}

.status.online {
    color: #159447;
}

/* CHAT */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chatHeader {
    height: 72px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 0 25px;
}

.chatName {
    font-weight: 700;
    font-size: 18px;
}

.chatStatus {
    font-size: 12px;
    color: #999;
    margin-top: 3px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.emptyChat {
    margin: auto;
    color: #999;
    text-align: center;
}

.message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 16px;
    word-wrap: break-word;
    line-height: 1.4;
}

.message.mine {
    align-self: flex-end;
    background: #111;
    color: white;
    border-bottom-right-radius: 4px;
}

.message.theirs {
    align-self: flex-start;
    background: white;
    border: 1px solid #eee;
    border-bottom-left-radius: 4px;
}

.messageTime {
    font-size: 10px;
    opacity: .55;
    margin-top: 4px;
    text-align: right;
}

.messageForm {
    background: white;
    border-top: 1px solid #ddd;
    padding: 15px;
    display: flex;
    gap: 10px;
}

#messageInput {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 12px 16px;
    outline: none;
}

#sendButton {
    border: 0;
    background: #111;
    color: white;
    border-radius: 20px;
    padding: 0 22px;
    cursor: pointer;
}

.mobileBack {
    display: none;
}

@media (max-width: 700px) {

    .sidebar {
        width: 100%;
    }

    .chat {
        display: none;
        width: 100%;
    }

    #app.chatOpen .sidebar {
        display: none;
    }

    #app.chatOpen .chat {
        display: flex;
    }

    .mobileBack {
        display: block;
        margin-right: 15px;
        border: 0;
        background: none;
        font-size: 24px;
        cursor: pointer;
    }

    .message {
        max-width: 85%;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="loginScreen">

    <div class="authBox">

        <div class="logo">17</div>

        <div class="subtitle" id="authSubtitle">
            Войдите в Messenger
        </div>

        <input
            id="usernameInput"
            type="text"
            placeholder="Логин"
            autocomplete="username"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button
            class="authButton"
            id="authButton"
        >
            Войти
        </button>

        <div
            class="switchAuth"
            id="switchAuth"
        >
            Нет аккаунта? Зарегистрироваться
        </div>

        <div
            class="authError"
            id="authError"
        ></div>

    </div>

</div>

<!-- APP -->

<div id="app" class="hidden">

    <aside class="sidebar">

        <div class="sidebarHeader">

            <div class="brand">
                17
            </div>

            <div class="myAccount">
                Вы: <strong id="myUsername"></strong>
            </div>

        </div>

        <div class="usersTitle">
            Пользователи
        </div>

        <div id="usersList"></div>

    </aside>

    <main class="chat">

        <div class="chatHeader">

            <button
                class="mobileBack"
                id="mobileBack"
            >
                ←
            </button>

            <div>

                <div
                    class="chatName"
                    id="chatName"
                >
                    Выберите пользователя
                </div>

                <div
                    class="chatStatus"
                    id="chatStatus"
                ></div>

            </div>

        </div>

        <div id="messages">

            <div class="emptyChat">
                Выберите пользователя для начала общения
            </div>

        </div>

        <div class="messageForm">

            <input
                id="messageInput"
                type="text"
                placeholder="Написать сообщение..."
                disabled
            >

            <button
                id="sendButton"
                disabled
            >
                Отправить
            </button>

        </div>

    </main>

</div>

<script>

let socket = null;

let currentUser = null;

let selectedUser = null;

let isRegisterMode = false;

let users = [];

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const usernameInput =
    document.getElementById("usernameInput");

const passwordInput =
    document.getElementById("passwordInput");

const authButton =
    document.getElementById("authButton");

const switchAuth =
    document.getElementById("switchAuth");

const authSubtitle =
    document.getElementById("authSubtitle");

const authError =
    document.getElementById("authError");

const usersList =
    document.getElementById("usersList");

const myUsername =
    document.getElementById("myUsername");

const chatName =
    document.getElementById("chatName");

const chatStatus =
    document.getElementById("chatStatus");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const mobileBack =
    document.getElementById("mobileBack");


/* =========================
   AUTH MODE
========================= */

switchAuth.addEventListener(
    "click",
    () => {

        isRegisterMode =
            !isRegisterMode;

        authError.textContent = "";

        if (isRegisterMode) {

            authSubtitle.textContent =
                "Создайте аккаунт";

            authButton.textContent =
                "Зарегистрироваться";

            switchAuth.textContent =
                "Уже есть аккаунт? Войти";

        } else {

            authSubtitle.textContent =
                "Войдите в Messenger";

            authButton.textContent =
                "Войти";

            switchAuth.textContent =
                "Нет аккаунта? Зарегистрироваться";
        }
    }
);


/* =========================
   WEBSOCKET
========================= */

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host
        );

    socket.addEventListener(
        "open",
        () => {

            console.log(
                "WebSocket подключён"
            );

        }
    );

    socket.addEventListener(
        "message",
        event => {

            let data;

            try {
                data =
                    JSON.parse(event.data);
            } catch {
                return;
            }

            handleServerMessage(data);
        }
    );

    socket.addEventListener(
        "close",
        () => {

            console.log(
                "WebSocket отключён"
            );

        }
    );

    socket.addEventListener(
        "error",
        () => {

            authError.textContent =
                "Ошибка подключения к серверу";

        }
    );
}


/* =========================
   SERVER EVENTS
========================= */

function handleServerMessage(data) {

    if (data.type === "auth_success") {

        currentUser =
            data.user;

        loginScreen.classList.add(
            "hidden"
        );

        app.classList.remove(
            "hidden"
        );

        myUsername.textContent =
            currentUser.username;

        authError.textContent = "";

        return;
    }


    if (data.type === "error") {

        authError.textContent =
            data.text;

        return;
    }


    if (data.type === "users") {

        users =
            data.users;

        renderUsers();

        return;
    }


    if (data.type === "history") {

        if (
            !selectedUser ||
            data.userId !== selectedUser.id
        ) {
            return;
        }

        renderMessages(
            data.messages
        );

        return;
    }


    if (data.type === "private_message") {

        if (!selectedUser) {
            return;
        }

        const belongsToChat =
            (
                data.from === currentUser.id &&
                data.to === selectedUser.id
            )
            ||
            (
                data.from === selectedUser.id &&
                data.to === currentUser.id
            );

        if (!belongsToChat) {
            return;
        }

        appendMessage(data);

        return;
    }
}


/* =========================
   AUTH
========================= */

authButton.addEventListener(
    "click",
    authenticate
);

passwordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            authenticate();
        }

    }
);

usernameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            authenticate();
        }

    }
);


function authenticate() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    authError.textContent = "";

    if (!username || !password) {

        authError.textContent =
            "Введите логин и пароль";

        return;
    }

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type:
                    isRegisterMode
                        ? "register"
                        : "login",

                username:
                    username,

                password:
                    password
            })
        );

    } else {

        authError.textContent =
            "Нет подключения к серверу";
    }
}


/* =========================
   USERS
========================= */

function renderUsers() {

    usersList.innerHTML = "";

    users
        .filter(
            user =>
                user.id !==
                currentUser?.id
        )
        .forEach(user => {

            const element =
                document.createElement("div");

            element.className =
                "user";

            if (
                selectedUser &&
                selectedUser.id === user.id
            ) {

                element.classList.add(
                    "active"
                );
            }

            const avatar =
                document.createElement("div");

            avatar.className =
                "avatar";

            avatar.textContent =
                user.username
                    .charAt(0)
                    .toUpperCase();

            const info =
                document.createElement("div");

            info.className =
                "userInfo";

            const name =
                document.createElement("div");

            name.className =
                "userName";

            name.textContent =
                user.username;

            const status =
                document.createElement("div");

            status.className =
                "status";

            if (user.online) {

                status.classList.add(
                    "online"
                );

                status.textContent =
                    "онлайн";

            } else {

                status.textContent =
                    "не в сети";
            }

            info.appendChild(name);
            info.appendChild(status);

            element.appendChild(avatar);
            element.appendChild(info);

            element.addEventListener(
                "click",
                () => selectUser(user)
            );

            usersList.appendChild(
                element
            );
        });
}


/* =========================
   SELECT USER
========================= */

function selectUser(user) {

    selectedUser =
        user;

    chatName.textContent =
        user.username;

    chatStatus.textContent =
        user.online
            ? "онлайн"
            : "не в сети";

    messageInput.disabled =
        false;

    sendButton.disabled =
        false;

    app.classList.add(
        "chatOpen"
    );

    renderUsers();

    messages.innerHTML = "";

    const loading =
        document.createElement("div");

    loading.className =
        "emptyChat";

    loading.textContent =
        "Загрузка истории...";

    messages.appendChild(
        loading
    );

    socket.send(
        JSON.stringify({

            type:
                "get_history",

            userId:
                user.id
        })
    );
}


/* =========================
   HISTORY
========================= */

function renderMessages(list) {

    messages.innerHTML = "";

    if (!list.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "emptyChat";

        empty.textContent =
            "Сообщений пока нет";

        messages.appendChild(
            empty
        );

        return;
    }

    list.forEach(
        appendMessage
    );

    scrollMessages();
}


/* =========================
   MESSAGE
========================= */

function appendMessage(message) {

    if (
        messages.querySelector(
            `[data-message-id="${message.id}"]`
        )
    ) {
        return;
    }

    const element =
        document.createElement("div");

    element.className =
        "message";

    element.dataset.messageId =
        message.id;

    if (
        message.from ===
        currentUser.id
    ) {

        element.classList.add(
            "mine"
        );

    } else {

        element.classList.add(
            "theirs"
        );
    }

    const text =
        document.createElement("div");

    text.textContent =
        message.text;

    const time =
        document.createElement("div");

    time.className =
        "messageTime";

    time.textContent =
        message.time;

    element.appendChild(text);
    element.appendChild(time);

    messages.appendChild(
        element
    );

    scrollMessages();
}


function scrollMessages() {

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   SEND
========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


function sendMessage() {

    if (
        !selectedUser ||
        !messageInput.value.trim()
    ) {
        return;
    }

    const text =
        messageInput.value.trim();

    socket.send(
        JSON.stringify({

            type:
                "private_message",

            to:
                selectedUser.id,

            text:
                text
        })
    );

    messageInput.value = "";

    messageInput.focus();
}


/* =========================
   MOBILE BACK
========================= */

mobileBack.addEventListener(
    "click",
    () => {

        app.classList.remove(
            "chatOpen"
        );

        selectedUser =
            null;

        messageInput.disabled =
            true;

        sendButton.disabled =
            true;

        chatName.textContent =
            "Выберите пользователя";

        chatStatus.textContent = "";

        messages.innerHTML =
            `<div class="emptyChat">
                Выберите пользователя для начала общения
            </div>`;

        renderUsers();
    }
);


/* =========================
   START
========================= */

connect();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>17 Messenger</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f2f2f7;
            color: #111;
        }

        button,
        input {
            font: inherit;
        }

        /* LOGIN */

        #loginScreen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f2f2f7;
        }

        .loginBox {
            width: min(420px, 90%);
            background: white;

            padding: 35px;
            border-radius: 24px;

            box-shadow:
                0 10px 40px rgba(0,0,0,.12);

            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .loginBox input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 14px;

            outline: none;

            margin-bottom: 12px;
        }

        .loginBox button {
            width: 100%;

            padding: 15px;

            border: 0;
            border-radius: 14px;

            background: #111;
            color: white;

            cursor: pointer;
        }

        /* APP */

        #app {
            display: none;

            height: 100vh;
            height: 100dvh;
        }

        /* USERS */

        #usersPanel {
            width: 300px;

            background: white;

            border-right: 1px solid #ddd;

            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;

            border-bottom: 1px solid #eee;
        }

        .headerLogo {
            font-size: 30px;
            font-weight: 800;
        }

        .myName {
            color: #777;
            margin-top: 4px;
            font-size: 14px;
        }

        .onlineTitle {
            padding: 15px 20px 8px;

            font-size: 13px;
            color: #888;
        }

        #usersList {
            overflow-y: auto;
            flex: 1;
        }

        .user {
            padding: 15px 20px;

            cursor: pointer;

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .user:hover {
            background: #f5f5f5;
        }

        .user.active {
            background: #e9e9ee;
        }

        .avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #111;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
        }

        .userName {
            font-weight: 600;
        }

        .onlineDot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #30c45a;

            margin-left: auto;
        }

        /* CHAT */

        #chat {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        #chatHeader {
            height: 70px;

            background: white;

            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;

            padding: 0 20px;

            font-weight: 700;
        }

        #chatName {
            font-size: 17px;
        }

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 25px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .empty {
            margin: auto;

            text-align: center;

            color: #999;
        }

        .message {
            max-width: 70%;

            padding: 10px 14px;

            border-radius: 18px;

            line-height: 1.4;

            word-wrap: break-word;
        }

        .message.mine {
            align-self: flex-end;

            background: #111;
            color: white;

            border-bottom-right-radius: 5px;
        }

        .message.theirs {
            align-self: flex-start;

            background: white;

            border-bottom-left-radius: 5px;
        }

        .time {
            font-size: 10px;

            opacity: .55;

            margin-top: 3px;

            text-align: right;
        }

        #inputArea {
            background: white;

            border-top: 1px solid #ddd;

            padding: 12px;

            display: flex;

            gap: 10px;
        }

        #messageInput {
            flex: 1;

            border: 1px solid #ddd;

            border-radius: 22px;

            padding: 12px 16px;

            outline: none;
        }

        #sendButton {
            width: 48px;
            height: 48px;

            border: 0;

            border-radius: 50%;

            background: #111;
            color: white;

            cursor: pointer;

            font-size: 20px;
        }

        #connectionStatus {
            position: fixed;

            top: 10px;
            right: 15px;

            font-size: 12px;

            z-index: 20;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            #usersPanel {
                width: 100%;
            }

            #chat {
                display: none;
            }

            #app.chatOpen #usersPanel {
                display: none;
            }

            #app.chatOpen #chat {
                display: flex;
            }

            #backButton {
                display: block;
            }

            .message {
                max-width: 82%;
            }
        }

        @media (min-width: 701px) {

            #backButton {
                display: none;
            }

        }

    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">17</div>

        <div class="subtitle">
            17 Messenger
        </div>

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="Введите ваше имя"
            autocomplete="off"
        >

        <button id="loginButton">
            Войти
        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

    <div id="usersPanel">

        <div class="header">

            <div class="headerLogo">
                17
            </div>

            <div
                class="myName"
                id="myName"
            ></div>

        </div>

        <div class="onlineTitle">
            ОНЛАЙН
        </div>

        <div id="usersList"></div>

    </div>


    <div id="chat">

        <div id="chatHeader">

            <button
                id="backButton"
                style="
                    border:0;
                    background:none;
                    font-size:22px;
                    margin-right:10px;
                    cursor:pointer;
                "
            >
                ‹
            </button>

            <div id="chatName">
                Выберите пользователя
            </div>

        </div>


        <div id="messages">

            <div class="empty">
                Выберите пользователя,
                чтобы начать чат
            </div>

        </div>


        <div id="inputArea">

            <input
                id="messageInput"
                type="text"
                placeholder="Сообщение..."
                autocomplete="off"
            >

            <button id="sendButton">
                ➤
            </button>

        </div>

    </div>

</div>


<div id="connectionStatus">
    ● подключение...
</div>


<script>

let socket = null;

let myName = "";

let selectedUser = "";

let onlineUsers = [];

const conversations = {};

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const app =
    document.getElementById(
        "app"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const usersList =
    document.getElementById(
        "usersList"
    );

const messages =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatName =
    document.getElementById(
        "chatName"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const myNameElement =
    document.getElementById(
        "myName"
    );


/* LOGIN */

loginButton.onclick = login;

nameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            login();
        }

    }
);


function login() {

    const name =
        nameInput.value
        .trim()
        .substring(0, 30);

    if (!name) {
        return;
    }

    myName = name;

    connect();

}


/* CONNECT */

function connect() {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host
        );


    socket.onopen = function() {

        connectionStatus.textContent =
            "● онлайн";

        connectionStatus.style.color =
            "#30c45a";

        socket.send(
            JSON.stringify({
                type: "login",
                username: myName
            })
        );

    };


    socket.onclose = function() {

        connectionStatus.textContent =
            "● отключён";

        connectionStatus.style.color =
            "#e53935";

    };


    socket.onerror = function() {

        connectionStatus.textContent =
            "● ошибка соединения";

        connectionStatus.style.color =
            "#e53935";

    };


    socket.onmessage =
        function(event) {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            /* LOGIN */

            if (
                data.type ===
                "login_success"
            ) {

                loginScreen.style.display =
                    "none";

                app.style.display =
                    "flex";

                myNameElement.textContent =
                    myName;

                return;
            }


            /* USERS */

            if (
                data.type ===
                "users"
            ) {

                onlineUsers =
                    data.users || [];

                renderUsers();

                return;
            }


            /* PRIVATE MESSAGE */

            if (
                data.type ===
                "private_message"
            ) {

                const otherUser =
                    data.from === myName
                        ? data.to
                        : data.from;


                if (
                    !conversations[
                        otherUser
                    ]
                ) {

                    conversations[
                        otherUser
                    ] = [];

                }


                conversations[
                    otherUser
                ].push(data);


                if (
                    selectedUser ===
                    otherUser
                ) {

                    renderMessages();

                }

                return;
            }


            /* ERROR */

            if (
                data.type ===
                "error"
            ) {

                alert(data.text);

            }

        };

}


/* USERS */

function renderUsers() {

    usersList.innerHTML = "";

    const users =
        onlineUsers.filter(
            user =>
                user !== myName
        );


    if (users.length === 0) {

        usersList.innerHTML = `
            <div
                style="
                    padding:20px;
                    color:#999;
                    text-align:center;
                "
            >
                Пока никого нет
            </div>
        `;

        return;
    }


    users.forEach(
        function(username) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "user";


            if (
                username ===
                selectedUser
            ) {

                item.classList.add(
                    "active"
                );

            }


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                username
                .charAt(0)
                .toUpperCase();


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "userName";

            name.textContent =
                username;


            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "onlineDot";


            item.appendChild(
                avatar
            );

            item.appendChild(
                name
            );

            item.appendChild(
                dot
            );


            item.onclick =
                function() {

                    openChat(username);

                };


            usersList.appendChild(
                item
            );

        }
    );

}


/* OPEN CHAT */

function openChat(username) {

    selectedUser =
        username;

    if (
        !conversations[
            username
        ]
    ) {

        conversations[
            username
        ] = [];

    }


    chatName.textContent =
        username;

    app.classList.add(
        "chatOpen"
    );

    renderUsers();

    renderMessages();

    messageInput.focus();

}


/* MESSAGES */

function renderMessages() {

    messages.innerHTML = "";

    const list =
        conversations[
            selectedUser
        ] || [];


    if (list.length === 0) {

        messages.innerHTML = `
            <div class="empty">
                Нет сообщений.<br>
                Напишите первым.
            </div>
        `;

        return;
    }


    list.forEach(
        function(message) {

            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " +
                (
                    message.from === myName
                        ? "mine"
                        : "theirs"
                );


            const text =
                document.createElement(
                    "div"
                );

            text.textContent =
                message.text;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "time";

            time.textContent =
                message.time;


            bubble.appendChild(
                text
            );

            bubble.appendChild(
                time
            );


            messages.appendChild(
                bubble
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* SEND */

function sendMessage() {

    const text =
        messageInput.value
        .trim();


    if (
        !text ||
        !selectedUser
    ) {

        return;

    }


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Нет подключения к серверу"
        );

        return;

    }


    socket.send(
        JSON.stringify({

            type:
                "private_message",

            to:
                selectedUser,

            text:
                text

        })
    );


    messageInput.value = "";

    messageInput.focus();

}


sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);


/* BACK ON MOBILE */

document
    .getElementById(
        "backButton"
    )
    .onclick =
    function() {

        app.classList.remove(
            "chatOpen"
        );

    };


/* AUTO LOGIN */

nameInput.focus();

</script>

</body>
</html>
